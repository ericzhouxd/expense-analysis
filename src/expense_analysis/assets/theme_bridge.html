<script>
// CSS-only surfaces and the sidebar selector follow Streamlit's native themes.
// Charts use the same bridge for a local fullscreen view. No network or app-data access.
(() => {
  window.jizhangThemeObserver?.disconnect();
  if (window.jizhangUiClickHandler) {
    document.removeEventListener('click', window.jizhangUiClickHandler);
  }
  if (window.jizhangUiKeyHandler) {
    document.removeEventListener('keydown', window.jizhangUiKeyHandler);
    document.removeEventListener('keydown', window.jizhangUiKeyHandler, true);
  }
  let pending = false;
  const syncThemeChoices = () => {
    const selected = window.jizhangThemeChoice || 'System';
    document.querySelectorAll('[data-jizhang-theme-choice]').forEach((control) => {
      control.setAttribute(
        'aria-checked',
        String(control.getAttribute('data-jizhang-theme-choice') === selected),
      );
    });
  };
  const syncCharts = () => {
    document.querySelectorAll('[data-testid="stPlotlyChart"]').forEach((chart) => {
      const expanded = chart.classList.contains('jizhang-chart-fullscreen');
      chart.setAttribute('role', 'button');
      chart.setAttribute('tabindex', '0');
      chart.setAttribute('aria-label', expanded ? 'Exit fullscreen chart' : 'Open chart fullscreen');
    });
    document.body.classList.toggle(
      'jizhang-chart-open',
      Boolean(document.querySelector('.jizhang-chart-fullscreen')),
    );
  };
  const syncFocusedTransaction = () => {
    const row = document.querySelector('[data-jizhang-transaction-focus="true"]');
    if (!row || window.jizhangFocusedTransaction === row.id) return;
    window.jizhangFocusedTransaction = row.id;
    requestAnimationFrame(() => requestAnimationFrame(() => {
      row.focus({preventScroll: true});
      row.scrollIntoView({behavior: 'smooth', block: 'center'});
    }));
  };
  const sync = () => {
    pending = false;
    const app = document.querySelector('.stApp');
    if (!app) return;
    const rgb = getComputedStyle(app).backgroundColor.match(/[\d.]+/g);
    if (!rgb || rgb.length < 3) return;
    const brightness = .2126 * Number(rgb[0]) + .7152 * Number(rgb[1]) + .0722 * Number(rgb[2]);
    const theme = brightness < 128 ? 'dark' : 'light';
    if (document.documentElement.dataset.jizhangTheme !== theme) {
      document.documentElement.dataset.jizhangTheme = theme;
    }
    syncThemeChoices();
    syncCharts();
    syncFocusedTransaction();
  };
  const chooseTheme = (theme) => {
    const openOption = document.querySelector(`[data-testid="stMainMenuItem-theme-${theme}"]`);
    if (openOption) {
      openOption.click();
      window.jizhangThemeChoice = theme;
      requestAnimationFrame(sync);
      return;
    }
    const menuButton = document.querySelector('[data-testid="stMainMenuButton"]');
    if (!menuButton) return;
    menuButton.click();
    let attempts = 0;
    const choose = () => {
      const option = document.querySelector(`[data-testid="stMainMenuItem-theme-${theme}"]`);
      if (option) {
        option.click();
        window.jizhangThemeChoice = theme;
        requestAnimationFrame(sync);
      } else if (attempts++ < 20) {
        requestAnimationFrame(choose);
      }
    };
    requestAnimationFrame(choose);
  };
  const readThemeChoice = () => {
    if (window.jizhangThemeChoice) return;
    const menuButton = document.querySelector('[data-testid="stMainMenuButton"]');
    if (!menuButton) return;
    menuButton.click();
    let attempts = 0;
    const read = () => {
      const selected = document.querySelector(
        '[data-testid^="stMainMenuItem-theme-"][aria-checked="true"]',
      );
      if (selected) {
        window.jizhangThemeChoice = selected.getAttribute('data-testid').split('-').at(-1);
        menuButton.click();
        syncThemeChoices();
      } else if (attempts++ < 20) {
        requestAnimationFrame(read);
      } else {
        menuButton.click();
        syncThemeChoices();
      }
    };
    requestAnimationFrame(read);
  };
  const resizeChart = (chart) => {
    requestAnimationFrame(() => {
      window.dispatchEvent(new Event('resize'));
      const plot = chart?.querySelector('.js-plotly-plot');
      if (plot && window.Plotly?.Plots) window.Plotly.Plots.resize(plot);
    });
  };
  const toggleChart = (chart) => {
    const willExpand = !chart.classList.contains('jizhang-chart-fullscreen');
    document.querySelectorAll('.jizhang-chart-fullscreen').forEach((openChart) => {
      openChart.classList.remove('jizhang-chart-fullscreen');
      openChart.setAttribute('aria-label', 'Open chart fullscreen');
    });
    if (willExpand) {
      chart.classList.add('jizhang-chart-fullscreen');
      chart.setAttribute('aria-label', 'Exit fullscreen chart');
    }
    const panel = chart.closest('[data-testid="stElementContainer"]');
    if (panel) panel.scrollTop = 0;
    document.body.classList.toggle('jizhang-chart-open', willExpand);
    resizeChart(chart);
  };
  const handleUiClick = (event) => {
    const themeChoice = event.target.closest('[data-jizhang-theme-choice]');
    if (themeChoice) {
      chooseTheme(themeChoice.getAttribute('data-jizhang-theme-choice'));
      return;
    }
    const chart = event.target.closest('[data-testid="stPlotlyChart"]');
    if (chart) {
      const bounds = chart.getBoundingClientRect();
      // Leave the right scrollbar and legend controls available without opening fullscreen.
      if (event.clientX >= bounds.left + chart.clientLeft + chart.clientWidth) return;
      if (event.target.closest('.legend, .rangeslider-container, .modebar')) return;
      toggleChart(chart);
    }
  };
  const addFieldSelectors = [
    '.st-key-add_transaction_date',
    '.st-key-add_transaction_type',
    '.st-key-add_transaction_description',
    '.st-key-add_transaction_merchant',
    '.st-key-add_transaction_amount',
    '.st-key-add_transaction_category',
    '.st-key-add_transaction_account',
    '.st-key-add_transaction_payment_method',
    '.st-key-add_transaction_notes',
  ];
  const addDateFieldSelector = addFieldSelectors[0];
  const fieldControl = (field) => field?.querySelector(
    'input:not([type="hidden"]), textarea, [role="combobox"], button',
  );
  const dateCalendarIsOpen = () => {
    const calendar = document.querySelector('[data-baseweb="calendar"]');
    return Boolean(calendar && calendar.getClientRects().length);
  };
  const closeAddDateCalendar = (field) => {
    if (!field?.matches(addDateFieldSelector) || !dateCalendarIsOpen()) return;
    // Base Web's calendar ignores programmatic blur, so replay the Tab keydown it
    // already treats as "close" before focus moves on. It reads keyCode, which the
    // KeyboardEvent constructor cannot set.
    const input = fieldControl(field);
    if (!input) return;
    const close = new KeyboardEvent('keydown', {
      key: 'Tab', code: 'Tab', bubbles: true, cancelable: true,
    });
    Object.defineProperty(close, 'keyCode', {get: () => 9});
    input.dispatchEvent(close);
  };
  const handleAddFormEnter = (event) => {
    if (event.key !== 'Enter' || event.shiftKey || event.isComposing) return false;
    const fields = addFieldSelectors.map((selector) => document.querySelector(selector));
    const index = fields.findIndex((field) => field?.contains(event.target));
    if (index < 0) return false;
    if (event.target.getAttribute?.('aria-expanded') === 'true') return false;

    event.preventDefault();
    event.stopImmediatePropagation();
    closeAddDateCalendar(fields[index]);
    if (index < fields.length - 1) {
      fieldControl(fields[index + 1])?.focus();
      return true;
    }

    const required = [
      ['.st-key-add_transaction_description', (value) => value.trim().length > 0],
      ['.st-key-add_transaction_amount', (value) => Number(value.replace(/[$,]/g, '')) > 0],
    ];
    for (const [selector, valid] of required) {
      const control = fieldControl(document.querySelector(selector));
      if (!control || !valid(control.value || '')) {
        control?.focus();
        return true;
      }
    }
    document.querySelector('.st-key-add_transaction_submit button')?.click();
    return true;
  };
  const handleUiKey = (event) => {
    if (handleAddFormEnter(event)) return;
    const chart = event.target.closest?.('[data-testid="stPlotlyChart"]');
    if (chart && (event.key === 'Enter' || event.key === ' ')) {
      event.preventDefault();
      toggleChart(chart);
      return;
    }
    if (event.key === 'Escape') {
      const openChart = document.querySelector('.jizhang-chart-fullscreen');
      if (openChart) toggleChart(openChart);
    }
  };
  document.addEventListener('click', handleUiClick);
  document.addEventListener('keydown', handleUiKey, true);
  window.jizhangUiClickHandler = handleUiClick;
  window.jizhangUiKeyHandler = handleUiKey;
  const observer = new MutationObserver(() => {
    if (!pending) { pending = true; requestAnimationFrame(sync); }
  });
  observer.observe(document.head, {childList: true, subtree: true, characterData: true});
  const app = document.querySelector('.stApp');
  if (app) {
    observer.observe(app, {
      childList: true,
      subtree: true,
    });
  }
  window.jizhangThemeObserver = observer;
  requestAnimationFrame(sync);
  requestAnimationFrame(readThemeChoice);
})();
</script>
