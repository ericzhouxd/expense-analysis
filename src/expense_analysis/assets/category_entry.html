<div class="category-entry">
      <label>Description<input name="description" autocomplete="off" placeholder="What was this for?" /></label>
      <label>Merchant<input name="merchant" autocomplete="off" placeholder="Optional" /></label>
      <label>Category<input name="category" list="expense-category-options" autocomplete="off" /></label>
      <datalist id="expense-category-options"></datalist>
      <div class="category-entry-help"><span role="status" aria-live="polite">Suggestions update as you type</span>
      <button type="button">Use automatic category</button></div>
    </div>
