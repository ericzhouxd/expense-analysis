[browser]
gatherUsageStats = false

[server]
address = "127.0.0.1"
headless = true
runOnSave = true
enableStaticServing = true

[client]
toolbarMode = "viewer"

[theme]
font = "Departure Mono, monospace"
headingFont = "Departure Mono, monospace"
codeFont = "Departure Mono, monospace"
baseFontSize = 14
baseRadius = "none"
buttonRadius = "none"
headingFontSizes = ["1.6rem", "1.1rem", "1rem"]
headingFontWeights = [400, 400, 400]
metricValueFontSize = "1.9rem"
showWidgetBorder = true
showSidebarBorder = true

[[theme.fontFaces]]
family = "Departure Mono"
url = "app/static/fonts/DepartureMono-Regular.woff2"
weight = 400

[[theme.fontFaces]]
family = "Anton"
url = "app/static/fonts/Anton-Regular.ttf"
weight = 400

[[theme.fontFaces]]
family = "Jizhang Wordmark"
url = "app/static/fonts/Jizhang-Wordmark.ttf"
weight = 900

[theme.light]
primaryColor = "#657900"
backgroundColor = "#E9EAE5"
secondaryBackgroundColor = "#F5F5F0"
textColor = "#151713"
borderColor = "#898E81"
dataframeHeaderBackgroundColor = "#E0E4D9"
linkColor = "#4C6200"
blueColor = "#65705C"
blueBackgroundColor = "#E2E7DC"
blueTextColor = "#45513E"
greenColor = "#426344"
greenBackgroundColor = "#E0EADC"
greenTextColor = "#365538"
yellowColor = "#805D1B"
yellowBackgroundColor = "#F0E7D2"
yellowTextColor = "#75521A"
redColor = "#A43E30"
redBackgroundColor = "#F3E0DA"
redTextColor = "#943A2D"

[theme.dark]
primaryColor = "#D1F52A"
backgroundColor = "#111310"
secondaryBackgroundColor = "#1B1E19"
textColor = "#EEF0E8"
borderColor = "#626C5B"
dataframeHeaderBackgroundColor = "#2A3225"
linkColor = "#D1F52A"
blueColor = "#B0BBA5"
blueBackgroundColor = "#252E21"
blueTextColor = "#C0CAB6"
greenColor = "#A6C79C"
greenBackgroundColor = "#233322"
greenTextColor = "#B3D0AA"
yellowColor = "#DFC084"
yellowBackgroundColor = "#362E1E"
yellowTextColor = "#E4C68D"
redColor = "#EFA494"
redBackgroundColor = "#38241F"
redTextColor = "#F0B0A2"

[theme.light.sidebar]
backgroundColor = "#DFE1D9"
secondaryBackgroundColor = "#F5F5F0"
textColor = "#151713"

[theme.dark.sidebar]
backgroundColor = "#090B08"
secondaryBackgroundColor = "#1B1E19"
textColor = "#EEF0E8"
