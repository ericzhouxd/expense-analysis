name: Bug report
description: Something in the app is broken or behaves incorrectly
title: "[Bug] "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report this.

        > [!WARNING]
        > This project is local-first and private. Do **not** paste real
        > transactions, account names, screenshots of real balances, or your
        > `data/`, `output/`, or `config.toml` contents. Reproduce with
        > synthetic data and temporary databases only.

  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: A clear description of the bug.
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Include the page you were on and the exact actions you took.
      placeholder: |
        1. Go to '...'
        2. Click on '...'
        3. Enter '...'
        4. See error
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behaviour
      description: What you expected to happen instead.
    validations:
      required: true

  - type: dropdown
    id: area
    attributes:
      label: Area
      description: Which part of the app is affected?
      options:
        - Overview
        - Transactions
        - Import / Export
        - Budgets
        - Advanced insights
        - Settings
        - Sidebar / theme / navigation
        - CLI (expense-add, expense-analyze, expense-import, expense-export)
        - Not sure
    validations:
      required: true

  - type: input
    id: commit
    attributes:
      label: Commit or version
      description: The commit SHA or branch you were running, if you know it.
      placeholder: e.g. f4004b4
    validations:
      required: false

  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Anything relevant about how you run the app.
      placeholder: |
        OS:
        Browser:
        Streamlit version:
        Python version:
    validations:
      required: false

  - type: checkboxes
    id: confirmations
    attributes:
      label: Before submitting
      options:
        - label: I reproduced this with synthetic data, not real financial data.
          required: true
        - label: I searched existing issues and this is not a duplicate.
          required: true
