version: 2
updates:
  # uv.lock is the resolved dependency set for the app and the dev group.
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    groups:
      python-minor-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]

  # No workflows are tracked yet; this entry keeps action bumps working as soon
  # as CI lands instead of requiring a second config change.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
