version: 2
updates:
  # uv.lock is the resolved dependency set for the app and the dev group.
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    groups:
      python-minor-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]

  # web/package-lock.json is the resolved set for the React interface.
  - package-ecosystem: "npm"
    directory: "/web"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    groups:
      web-minor-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]

  # Pinned action SHAs in .github/workflows/checks.yml.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
