name: checks

on:
  push:
  pull_request:

# A superseded run on the same ref has no value once a newer commit lands.
concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    name: format, lint, types, tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true

      - name: Install dependencies from the lockfile
        run: uv sync --locked --all-groups

      - name: Check formatting
        run: uv run ruff format --check .

      - name: Lint
        run: uv run ruff check .

      - name: Type check
        run: uv run mypy

      - name: Run tests
        run: uv run pytest

  rendered:
    name: rendered geometry
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true

      - name: Install dependencies from the lockfile
        run: uv sync --locked --all-groups

      # The runner image ships Google Chrome. Naming it through EXPECT_CHROMIUM
      # makes a missing browser fail this job instead of skipping every check.
      - name: Confirm the browser is available
        run: google-chrome --version

      - name: Measure the rendered pages
        run: uv run pytest -m rendered
        env:
          EXPECT_CHROMIUM: google-chrome
