[project]
name = "expense-analysis"
version = "0.1.0"
description = "A privacy-first, local expense tracker and analysis dashboard."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "pandas>=2.3,<4",
    "plotly>=6.2,<8",
    "streamlit>=1.60,<2",
]

[project.scripts]
expense-add = "expense_analysis.cli:add_main"
expense-analyze = "expense_analysis.cli:analyze_main"
expense-import = "expense_analysis.cli:import_main"
expense-export = "expense_analysis.cli:export_main"

[dependency-groups]
dev = [
    "mypy>=1.19,<3",
    "pandas-stubs>=2.3,<2.4",
    "pre-commit>=4.6.2",
    "pytest>=8.4,<10",
    "ruff>=0.12,<1",
]
# Only tests/test_rendered_geometry.py needs this, and only when -m rendered runs.
rendered = [
    "websockets>=15,<17",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/expense_analysis"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q -m \"not rendered\""
markers = [
    "rendered: needs Chromium and a booted app; run with `uv run pytest -m rendered`",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.mypy]
python_version = "3.12"
files = ["src/expense_analysis", "tests"]
check_untyped_defs = true
strict_equality = true
warn_redundant_casts = true
warn_unused_ignores = true
no_implicit_optional = true

# Application code is fully annotated; tests use untyped fixtures and helpers.
[[tool.mypy.overrides]]
module = ["expense_analysis.*"]
disallow_untyped_defs = true
disallow_incomplete_defs = true
warn_return_any = true

# plotly ships no stubs and no py.typed marker.
[[tool.mypy.overrides]]
module = ["plotly.*"]
ignore_missing_imports = true
